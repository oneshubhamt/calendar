name: CLEER visual baseline probe

on:
  push:
    branches:
      - working

permissions:
  contents: read

jobs:
  browser:
    name: Pre-C Chromium visual probe
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout pre-C source
        uses: actions/checkout@v7.0.1
        with:
          ref: 980b41a6dbfe78afa151d3cd9ec920f11f6f6dcf

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Use pinned npm
        run: npm install --global npm@12.2.2

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Probe committed visual baselines
        run: npx playwright test tests/browser/visual.spec.mjs --project=chromium --config=playwright.config.mjs