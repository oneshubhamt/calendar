name: CLEER final browser QA

on:
  push:
    branches:
      - working

permissions:
  contents: read

concurrency:
  group: cleer-final-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: Full native browser matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Use pinned npm
        run: npm install --global npm@12.2.2

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run browser release QA
        run: npm run qa:browser

      - name: Upload Playwright failure report
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: cleer-browser-playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7