name: Bootstrap calendar source repository

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js 26 LTS
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 26.13.0

      - name: Use npm 12.2.2
        run: npm install --global npm@12.2.2

      - name: Verify seeded release archive
        shell: bash
        run: |
          set -euo pipefail
          echo "b773b77347a8d1629128b9d56b93e29b3f962ff990055735a9f7b413446a9343  director-calendar-v1.0.0-rc.9-generic.zip" | sha256sum --check --strict

      - name: Import clean source tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .bootstrap-src
          mkdir .bootstrap-src
          unzip -q director-calendar-v1.0.0-rc.9-generic.zip -d .bootstrap-src

          for dir in src tests docs fixtures demo; do
            rm -rf "$dir"
            cp -R ".bootstrap-src/$dir" "$dir"
          done

          cp .bootstrap-src/README.md README.md
          cp .bootstrap-src/package.json package.json
          cp .bootstrap-src/tsconfig.json tsconfig.json

          rm -rf .bootstrap-src
          rm director-calendar-v1.0.0-rc.9-generic.zip
          rm .github/workflows/bootstrap.yml

      - name: Configure repository toolchain and metadata
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';

          const path = 'package.json';
          const pkg = JSON.parse(readFileSync(path, 'utf8'));

          pkg.packageManager = 'npm@12.2.2';
          pkg.repository = {
            type: 'git',
            url: 'git+https://github.com/oneshubhamt/calendar.git'
          };
          pkg.bugs = {
            url: 'https://github.com/oneshubhamt/calendar/issues'
          };
          pkg.homepage = 'https://github.com/oneshubhamt/calendar#readme';
          pkg.devDependencies = {
            ...pkg.devDependencies,
            typescript: '7.0.2'
          };
          pkg.scripts = {
            ...pkg.scripts,
            check: 'npm run typecheck && npm test && npm pack --dry-run',
            prepack: 'npm run build'
          };

          writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n');

          const readmePath = 'README.md';
          let readme = readFileSync(readmePath, 'utf8');
          readme = readme.replace(
            /## Quality\n\n```bash\nnpm run typecheck\nnpm test\n```/,
            `## Development

Use the repository-pinned toolchain:

\`\`\`bash
nvm use
npm ci
npm run check
\`\`\`

The normal quality gate is strict TypeScript typechecking, the complete non-visual test suite, and package-content validation. Screenshot/browser-gallery QA is intentionally separate from routine QA.`
          );
          writeFileSync(readmePath, readme);
          NODE

          cat > .nvmrc <<'EOF'
          26.13.0
          EOF

          cat > .npmrc <<'EOF'
          save-exact=true
          EOF

          cat > .gitignore <<'EOF'
          node_modules/
          dist/
          *.tgz
          *.log
          coverage/
          ci-artifacts/
          .DS_Store
          EOF

          cat > .editorconfig <<'EOF'
          root = true

          [*]
          charset = utf-8
          end_of_line = lf
          insert_final_newline = true

          [*.{ts,js,mjs,json,yml,yaml}]
          indent_style = space
          indent_size = 2
          EOF

          cat > CONTRIBUTING.md <<'EOF'
          # Contributing

          Use the repository-pinned Node.js and npm versions before changing the calendar:

          ```sh
          nvm use
          npm ci
          npm run check
          ```

          `npm run check` is the normal quality gate: strict TypeScript typechecking, the complete non-visual test suite, and package-content validation. Screenshot/browser-gallery testing is intentionally not part of routine QA.

          Keep the core calendar domain-generic. Application-specific semantics belong behind adapters, integrations, or optional feature modules.
          EOF

          cat > .github/workflows/ci.yml <<'EOF'
          name: CI

          on:
            push:
            pull_request:
            workflow_dispatch:

          permissions:
            contents: read

          concurrency:
            group: ci-${{ github.workflow }}-${{ github.ref }}
            cancel-in-progress: true

          jobs:
            quality:
              name: Typecheck, test and package
              runs-on: ubuntu-24.04
              timeout-minutes: 10

              steps:
                - name: Checkout
                  uses: actions/checkout@v7.0.1

                - name: Set up Node.js
                  uses: actions/setup-node@v7.1.0
                  with:
                    node-version-file: .nvmrc
                    cache: npm
                    cache-dependency-path: package-lock.json

                - name: Use pinned npm
                  run: npm install --global npm@12.2.2

                - name: Verify toolchain
                  run: |
                    node --version
                    npm --version

                - name: Install dependencies
                  run: npm ci

                - name: Quality gate
                  run: npm run check
          EOF

          cat > .github/dependabot.yml <<'EOF'
          version: 2
          updates:
            - package-ecosystem: npm
              directory: /
              schedule:
                interval: weekly
              open-pull-requests-limit: 5
              groups:
                development-toolchain:
                  patterns:
                    - typescript

            - package-ecosystem: github-actions
              directory: /
              schedule:
                interval: weekly
              open-pull-requests-limit: 5
          EOF

      - name: Generate lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Install from lockfile
        run: npm ci

      - name: Verify exact toolchain
        run: |
          test "$(node --version)" = "v26.13.0"
          test "$(npm --version)" = "12.2.2"
          test "$(npx tsc --version)" = "Version 7.0.2"

      - name: Run complete non-visual QA
        run: npm run check

      - name: Commit clean source repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Import Director Calendar rc.9 and initialize modern toolchain"
          git push origin HEAD:main
