name: Bootstrap calendar source repository

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js 26 LTS
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 26.13.0

      - name: Use npm 12.2.2
        run: npm install --global npm@12.2.2

      - name: Verify seeded release archive
        run: echo "b773b77347a8d1629128b9d56b93e29b3f962ff990055735a9f7b413446a9343  director-calendar-v1.0.0-rc.9-generic.zip" | sha256sum --check --strict

      - name: Import source and configure repository
        run: node .github/bootstrap.mjs

      - name: Generate lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Install from lockfile
        run: npm ci

      - name: Verify exact toolchain
        run: |
          test "$(node --version)" = "v26.13.0"
          test "$(npm --version)" = "12.2.2"
          test "$(npx tsc --version)" = "Version 7.0.2"

      - name: Run complete non-visual QA
        run: npm run check

      - name: Commit clean source repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Import Director Calendar rc.9 and initialize modern toolchain"
          git push origin HEAD:main
