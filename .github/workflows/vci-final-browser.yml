name: VC-I Final Browser QA

on:
  push:
    branches:
      - "working"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vci-final-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: Targeted checks and full browser matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Use pinned npm
        run: npm install --global npm@12.2.2

      - name: Install dependencies
        run: npm ci

      - name: Verify toolchain
        run: |
          test "$(node --version)" = "v26.13.0"
          test "$(npm --version)" = "12.2.2"
          test "$(npx tsc --version)" = "Version 7.0.2"

      - name: Targeted VC-I Node QA
        run: |
          npm run build
          node --test tests/custom-view.test.mjs tests/resource-time-grid-layout.test.mjs tests/architecture-guards.test.mjs

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Full configured browser QA
        run: npx playwright test --config=playwright.config.mjs
