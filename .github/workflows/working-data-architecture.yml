name: Working data architecture verification

on:
  push:
    branches:
      - "working"

permissions:
  contents: read

concurrency:
  group: working-data-architecture-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Targeted storage/sync and complete QA
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Use pinned npm
        run: npm install --global npm@12.2.2

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Targeted interoperability and architecture tests
        run: |
          node --test \
            tests/interoperability.test.mjs \
            tests/architecture-guards.test.mjs

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Native IndexedDB and cross-tab QA
        run: npx playwright test --config=playwright.config.mjs tests/browser/storage.spec.mjs

      - name: Complete repository quality gate
        run: npm run check

      - name: Complete browser QA
        run: npm run qa:browser
