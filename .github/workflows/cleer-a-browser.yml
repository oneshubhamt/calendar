name: CLEER-A targeted browser QA

on:
  push:
    branches:
      - working

permissions:
  contents: read

concurrency:
  group: cleer-a-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: Mutation lifecycle browser smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Use pinned npm
        run: npm install --global npm@12.2.2

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Run affected browser smoke
        run: npx playwright test tests/browser/rendering-smoke.spec.mjs --project=chromium --config=playwright.config.mjs
