name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:
    inputs:
      full:
        description: "Run native publication compiler and byte-parity gate"
        type: boolean
        default: false
      mutation:
        description: "Run targeted regression fault injections"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, test and package
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Use pinned npm
        run: npm install --global npm@12.2.2

      - name: Install dependencies
        run: npm ci

      - name: Verify toolchain
        run: |
          test "$(node --version)" = "v26.13.0"
          test "$(npm --version)" = "12.2.2"
          test "$(npx tsc --version)" = "Version 7.0.2"

      - name: Fast single-build QA
        if: false
        run: npm run check:fast

      - name: Full native package/parity QA
        run: npm run check:full

      - name: Invariant witness and lane coverage
        run: npm run qa:coverage

      - name: Selective fault injection
        if: inputs.mutation == true
        run: npm run qa:mutation
