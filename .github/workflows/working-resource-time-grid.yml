name: Working Resource TimeGrid QA

on:
  workflow_dispatch:
  push:
    branches: [working]
    paths:
      - ".github/workflows/working-resource-time-grid.yml"
      - "playwright.resource-time-grid.config.mjs"
      - "tests/browser/resource-time-grid.spec.mjs"
      - "tests/browser/resource-scheduler.spec.mjs"

jobs:
  browser-resource-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26.13.0"
          cache: npm
      - name: Use pinned npm
        run: npm install --global npm@12.2.2
      - name: Install dependencies
        run: npm ci
      - name: Verify installed Chrome
        run: google-chrome --version
      - name: Build
        run: npm run build
      - name: Targeted Resource Scheduler and TimeGrid browser QA
        run: npx playwright test --config=playwright.resource-time-grid.config.mjs tests/browser/resource-scheduler.spec.mjs tests/browser/resource-time-grid.spec.mjs
