name: VC-I Visual Baselines

on:
  push:
    branches: [working]
    paths:
      - ".github/workflows/vci-visual-baselines.yml"

jobs:
  update-visual-baselines:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.65.0-noble
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26.13.0"
          cache: npm
      - name: Use pinned npm
        run: npm install --global npm@12.2.2
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Update Chromium visual baselines
        run: npx playwright test tests/browser/visual.spec.mjs --project=chromium --update-snapshots
      - name: Upload visual baselines
        uses: actions/upload-artifact@v4
        with:
          name: vci-visual-baselines
          path: tests/browser/__screenshots__/
          if-no-files-found: error
