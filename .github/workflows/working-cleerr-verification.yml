name: Working CLEERR verification

on:
  push:
    branches:
      - "working"

permissions:
  contents: read

concurrency:
  group: working-cleerr-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Exact targeted and complete QA
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Use pinned npm
        run: npm install --global npm@12.2.2

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Exact targeted layout and interaction tests
        run: |
          node --test \
            tests/core.test.mjs \
            tests/point-temporal-layout.test.mjs \
            tests/resource-scheduler-layout.test.mjs \
            tests/resource-scheduler-interaction.test.mjs

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Relevant browser rendering QA
        run: |
          npx playwright test --config=playwright.config.mjs \
            tests/browser/rendering-smoke.spec.mjs \
            tests/browser/resource-scheduler.spec.mjs \
            tests/browser/visual.spec.mjs

      - name: Complete repository quality gate
        run: npm run check
