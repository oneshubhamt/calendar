name: CLEER de novo functional browser QA

on:
  push:
    branches:
      - working

permissions:
  contents: read

concurrency:
  group: cleer-denovo-functional-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm install --global npm@12.2.2
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run build
      - name: Run complete functional browser matrix
        run: npx playwright test tests/browser/storage.spec.mjs tests/browser/rendering-smoke.spec.mjs tests/browser/resource-scheduler.spec.mjs tests/browser/resource-time-grid.spec.mjs --config=playwright.config.mjs