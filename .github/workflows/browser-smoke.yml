name: Browser QA

on:
  push:
  pull_request:
  schedule:
    - cron: "47 3 * * 0"
  workflow_dispatch:
    inputs:
      full:
        description: "Run exhaustive all-engine browser release QA"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: browser-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: Routine or exhaustive browser evidence
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
      options: --ipc=host --cap-add=SYS_ADMIN
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "26.13.0"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Use pinned npm
        run: npm install --global npm@12.2.2

      - name: Install dependencies
        run: npm ci

      - name: Verify pinned browser toolchain
        run: |
          test "$(cat .nvmrc)" = "26.13.0"
          test "$(node --version)" = "v26.13.0"
          test "$(npm --version)" = "12.2.2"
          test "$(npx tsc --version)" = "Version 7.0.2"
          test "$(npx playwright --version)" = "Version 1.65.0"

      - name: Run routine tagged browser smoke
        if: github.event_name != 'schedule' && github.ref != 'refs/heads/main' && github.base_ref != 'main' && inputs.full != true
        env:
          HOME: /root
        run: npm run qa:browser:smoke

      - name: Run exhaustive browser release QA
        if: github.event_name == 'schedule' || github.ref == 'refs/heads/main' || github.base_ref == 'main' || inputs.full == true
        env:
          HOME: /root
        run: npm run qa:browser

      - name: Upload Playwright failure report
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: browser-qa-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
