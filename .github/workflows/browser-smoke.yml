name: Browser smoke QA

on:
  push:
    branches:
      - "working"
      - "qa-browser-pass-c" # temporary verification; remove after pass
  pull_request:
    branches:
      - "working"
      - "main"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Tagged smoke and cross-browser witnesses
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
      options: --ipc=host --cap-add=SYS_ADMIN
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "26.13.0"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Use pinned npm
        run: npm install --global npm@12.2.2

      - name: Install dependencies
        run: npm ci

      - name: Verify pinned browser toolchain
        run: |
          test "$(cat .nvmrc)" = "26.13.0"
          test "$(node --version)" = "v26.13.0"
          test "$(npm --version)" = "12.2.2"
          test "$(npx tsc --version)" = "Version 7.0.2"
          test "$(npx playwright --version)" = "Version 1.65.0"

      - name: Run tagged browser smoke
        env:
          HOME: /root
        run: npm run qa:browser:smoke

      - name: Upload Playwright failure report
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: browser-smoke-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
